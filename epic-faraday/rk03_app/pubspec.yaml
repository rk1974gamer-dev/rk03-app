name: rk03_launcher
description: Android Launcher e App Hub oficial para RK-03 Tech & Gaming PC (Squarespace Sync)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.2.4
  http: ^1.2.0
  shared_preferences: ^2.2.2
  device_apps: ^2.2.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock_data/
